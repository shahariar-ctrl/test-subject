<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Example</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    overflow-x: hidden;
  }

  body {
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f5f6f8;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px;
    background: #ffffff;
    border-bottom: 1px solid #e6e8eb;
    position: relative;
  }

  .logo {
    font-weight: 600;
    font-size: 17px;
    color: #16213a;
    letter-spacing: -0.01em;
  }

  /* Hamburger button */
  .menu-toggle {
    background: none;
    border: 1px solid #d7dbe1;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 38px;
    height: 34px;
  }

  .menu-toggle span {
    width: 16px;
    height: 2px;
    background: #38445c;
    display: block;
    margin: 0 auto;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  .menu-toggle.active span:nth-child(1) {
    transform: translateY(6px) rotate(45deg);
  }
  .menu-toggle.active span:nth-child(2) {
    opacity: 0;
  }
  .menu-toggle.active span:nth-child(3) {
    transform: translateY(-6px) rotate(-45deg);
  }

  /* Dropdown menu panel */
  .menu-panel {
    position: absolute;
    top: 100%;
    right: 0;
    width: 300px;
    background: #ffffff;
    border: 1px solid #e6e8eb;
    border-top: none;
    box-shadow: 0 12px 28px rgba(22, 33, 58, 0.1);
    padding: 8px 0;
    overflow: hidden;
    transform: translateX(100%);
    opacity: 0;
    visibility: hidden;
    transition: transform 0.28s ease, opacity 0.28s ease, visibility 0.28s;
  }

  .menu-panel.open {
    transform: translateX(0);
    opacity: 1;
    visibility: visible;
  }

  .menu-col {
    padding: 16px 28px;
  }

  .menu-col + .menu-col {
    border-top: 1px solid #eef0f3;
  }

  .menu-col h4 {
    font-size: 12px;
    font-weight: 600;
    color: #8a93a3;
    margin-bottom: 10px;
  }

  .menu-col a {
    display: flex;
    align-items: center;
    color: #1c2536;
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 500;
    padding: 8px 0;
    border-radius: 4px;
    transition: color 0.15s ease, padding-left 0.15s ease;
  }

  .menu-col a:hover {
    color: #2757c9;
    padding-left: 4px;
  }

  @media (max-width: 480px) {
    .menu-panel {
      width: 100%;
      height: 50vh;
      overflow-y: auto;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">YourLogo</div>

  <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="menu-panel" id="menuPanel">
    <div class="menu-col">
      <h4>Company</h4>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
    <div class="menu-col">
      <h4>Product</h4>
      <a href="#">Programs</a>
      <a href="#">FAQ</a>
    </div>
    <div class="menu-col">
      <h4>Legal</h4>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </div>
  </nav>
</header>

<script>
  function toggleMenu() {
    document.getElementById('menuPanel').classList.toggle('open');
    document.getElementById('menuToggle').classList.toggle('active');
  }
</script>

</body>
</html>
